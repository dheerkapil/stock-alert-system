<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Alert Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding: 10px; }
        .container { max-width: 100%; padding: 0; }
        .card { border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 12px; padding: 12px; }
        .card h5 { font-size: 1rem; margin-bottom: 8px; }

        .status-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #ccc;
            padding: 0;
            cursor: pointer;
            font-size: 0.6rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #ccc;
            color: #fff;
            transition: 0.2s;
        }
        .status-btn.active { background: #28a745; border-color: #28a745; }
        .status-btn.triggered { background: #dc3545; border-color: #dc3545; cursor: not-allowed; opacity: 0.8; }
        .status-btn.inactive { background: #6c757d; border-color: #6c757d; }

        .cmp-green { color: #28a745; font-weight: 600; }
        .cmp-red { color: #dc3545; font-weight: 600; }
        .cmp-neutral { color: #6c757d; }

        .input-group { position: relative; }
        #symbolInput { position: relative; z-index: 1000; font-size: 0.9rem; padding: 0.3rem 0.5rem; }
        .autocomplete-items {
            position: absolute;
            z-index: 999;
            width: 100%;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            max-height: 180px;
            overflow-y: auto;
            border-radius: 0 0 8px 8px;
            top: 100%;
            left: 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .autocomplete-item {
            padding: 6px 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 0.85rem;
        }
        .autocomplete-item:hover { background: #f0f0f0; }
        .autocomplete-item .symbol { font-weight: bold; margin-right: 6px; }
        .autocomplete-item .name { color: #555; font-size: 0.75rem; }

        /* Table: moderate */
        .table {
            margin-bottom: 0;
            font-size: 0.8rem;
        }
        .table th {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #555;
            border-bottom: 2px solid #ddd;
            padding: 6px 4px;
            font-weight: 700;
        }
        .table td {
            padding: 6px 4px;
            vertical-align: middle;
            border-bottom: 1px solid #eee;
        }
        .table .btn-sm {
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 6px;
            margin: 0 3px;
            border: 1px solid transparent;
            background: #f1f3f5;
        }
        .table .btn-sm:hover { background: #e9ecef; }
        .table .btn-outline-primary { color: #0d6efd; border-color: #0d6efd; background: white; }
        .table .btn-outline-danger { color: #dc3545; border-color: #dc3545; background: white; }
        .table .btn-outline-warning { color: #ffc107; border-color: #ffc107; background: white; }

        .form-label { font-size: 0.75rem; margin-bottom: 2px; font-weight: 600; color: #444; }
        .form-control-sm, .form-select-sm { font-size: 0.9rem; padding: 0.3rem 0.5rem; }
        #addBtn { font-size: 0.9rem; padding: 0.3rem 0.6rem; }

        .btn-tool { font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 10px; }

        @media (max-width: 576px) {
            body { padding: 5px; }
            .card { padding: 8px; margin-bottom: 8px; }
            .card h5 { font-size: 0.9rem; }
            .table { font-size: 0.75rem; }
            .table th { font-size: 0.6rem; padding: 4px 3px; }
            .table td { padding: 4px 3px; }
            .table .btn-sm {
                padding: 4px 6px;
                font-size: 0.7rem;
                margin: 0 2px;
            }
            .status-btn { width: 20px; height: 20px; font-size: 0.5rem; }
            .form-control-sm, .form-select-sm { font-size: 0.85rem; padding: 0.25rem 0.4rem; }
            #addBtn { font-size: 0.85rem; padding: 0.25rem 0.4rem; }
            .btn-tool { font-size: 0.65rem; padding: 0.15rem 0.5rem; }
            .autocomplete-item { padding: 5px 8px; font-size: 0.8rem; }
            .autocomplete-item .name { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="container">

    <h1 class="text-center mb-3" style="font-size: 1.4rem;">📊 Alert Manager</h1>

    <!-- ADD ALERT FORM -->
    <div class="card">
        <h5>➕ Add New Alert</h5>
        <div class="row g-2 align-items-end">
            <div class="col-12 col-md-4">
                <label class="form-label">Symbol</label>
                <div class="input-group">
                    <input type="text" id="symbolInput" class="form-control form-control-sm" placeholder="Type symbol or name" autocomplete="off" style="z-index:1001;">
                    <div id="autocompleteList" class="autocomplete-items" style="display:none;"></div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label">Condition</label>
                <select id="condSelect" class="form-select form-select-sm">
                    <option value=">=" selected>&gt;=</option>
                    <option value="<=">&lt;=</option>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label">Price</label>
                <input type="number" id="priceInput" class="form-control form-control-sm" placeholder="e.g. 5000" step="0.01">
            </div>
            <div class="col-12 col-md-2">
                <button id="addBtn" class="btn btn-primary btn-sm w-100">Add</button>
            </div>
        </div>
        <div id="addMessage" class="mt-2 small" style="font-size:0.85rem;"></div>
    </div>

    <!-- DATA TOOLS -->
    <div class="card" style="padding: 6px 10px;">
        <div class="d-flex flex-wrap gap-2 align-items-center">
            <span style="font-size:0.8rem; font-weight:600;">💾</span>
            <button id="exportBtn" class="btn btn-outline-success btn-tool">📥 Export</button>
            <button id="importBtn" class="btn btn-outline-primary btn-tool">📤 Import</button>
            <input type="file" id="fileInput" accept=".json" style="display: none;">
            <span id="importStatus" class="text-muted" style="font-size:0.7rem;"></span>
        </div>
    </div>

    <!-- ALERTS TABLE -->
    <div class="card" style="padding: 4px 2px;">
        <h5 style="padding-left:4px; font-size:0.95rem;">📋 Your Alerts</h5>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th style="text-align:center;">Cond</th>
                        <th style="text-align:right;">Trigger</th>
                        <th style="text-align:right;">CMP</th>
                        <th style="text-align:center;">Status</th>
                        <th style="text-align:center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="alertTableBody">
                    <tr><td colspan="6" class="text-center text-muted" style="font-size:0.9rem;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
// ---------- AUTOCOMPLETE ----------
const symbolInput = document.getElementById('symbolInput');
const autocompleteList = document.getElementById('autocompleteList');

symbolInput.addEventListener('input', function() {
    const query = this.value.trim();
    if (query.length < 1) { autocompleteList.style.display = 'none'; return; }
    fetch(`/api/search?q=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(data => {
            if (data.length === 0) { autocompleteList.style.display = 'none'; return; }
            let html = '';
            data.forEach(item => {
                html += `<div class="autocomplete-item" data-symbol="${item.symbol}">
                    <span class="symbol">${item.symbol}</span>
                    <span class="name">${item.name}</span>
                </div>`;
            });
            autocompleteList.innerHTML = html;
            autocompleteList.style.display = 'block';
            document.querySelectorAll('.autocomplete-item').forEach(el => {
                el.addEventListener('click', function() {
                    symbolInput.value = this.dataset.symbol;
                    autocompleteList.style.display = 'none';
                    symbolInput.blur();
                });
            });
        })
        .catch(() => { autocompleteList.style.display = 'none'; });
});
document.addEventListener('click', function(e) {
    if (e.target !== symbolInput) autocompleteList.style.display = 'none';
});

// ---------- FETCH ALERTS (with CMP) ----------
function fetchAlerts() {
    fetch('/api/alerts')
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('alertTableBody');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted" style="font-size:0.9rem;">No alerts set.</td></tr>`;
                return;
            }
            let html = '';
            data.forEach(a => {
                let cmpDisplay = '-';
                let cmpClass = 'cmp-neutral';
                if (a.cmp !== null && a.cmp !== undefined) {
                    cmpDisplay = a.cmp;
                    if (a.condition === '>=' && a.cmp >= a.trigger_price) cmpClass = 'cmp-green';
                    else if (a.condition === '<=' && a.cmp <= a.trigger_price) cmpClass = 'cmp-green';
                    else cmpClass = 'cmp-red';
                }

                let statusClass = 'inactive';
                let statusText = '⚪';
                let disabled = '';
                if (a.is_triggered === 1) {
                    statusClass = 'triggered';
                    statusText = '🔴';
                    disabled = 'disabled';
                } else if (a.is_active === 1) {
                    statusClass = 'active';
                    statusText = '🟢';
                } else {
                    statusClass = 'inactive';
                    statusText = '⚪';
                }

                html += `<tr>
                    <td><strong>${a.symbol}</strong></td>
                    <td style="text-align:center;">${a.condition}</td>
                    <td style="text-align:right;">${a.trigger_price}</td>
                    <td style="text-align:right;" class="${cmpClass}">${cmpDisplay}</td>
                    <td style="text-align:center;">
                        <button class="status-btn ${statusClass}" data-id="${a.id}" data-active="${a.is_active}" data-triggered="${a.is_triggered}" ${disabled}>
                            ${statusText}
                        </button>
                    </td>
                    <td style="text-align:center; white-space:nowrap;">
                        <button class="btn btn-sm btn-outline-primary edit-btn" data-id="${a.id}" data-price="${a.trigger_price}" title="Edit">✏️</button>
                        ${a.is_triggered ? `<button class="btn btn-sm btn-outline-warning reactivate-btn" data-id="${a.id}" title="Reactivate">🔄</button>` : ''}
                        <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${a.id}" title="Delete">🗑️</button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;

            document.querySelectorAll('.status-btn:not([disabled])').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    fetch(`/api/toggle/${id}`, { method: 'POST' })
                        .then(res => res.json())
                        .then(data => {
                            if (data.status === 'ok') fetchAlerts();
                        });
                });
            });

            document.querySelectorAll('.edit-btn').forEach(b => {
                b.addEventListener('click', function() {
                    const id = this.dataset.id;
                    const currentPrice = this.dataset.price;
                    const newPrice = prompt(`New price for alert ${id}:`, currentPrice);
                    if (newPrice !== null && !isNaN(parseFloat(newPrice)) && parseFloat(newPrice) > 0) {
                        fetch(`/api/update/${id}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ price: parseFloat(newPrice) })
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data.status === 'ok') { alert('✅ Updated!'); fetchAlerts(); }
                            else { alert('❌ ' + data.message); }
                        });
                    } else if (newPrice !== null) alert('❌ Invalid price.');
                });
            });

            document.querySelectorAll('.reactivate-btn').forEach(b => {
                b.addEventListener('click', function() {
                    const id = this.dataset.id;
                    fetch(`/api/reactivate/${id}`, { method: 'POST' })
                        .then(res => res.json())
                        .then(data => {
                            if (data.status === 'ok') fetchAlerts();
                        });
                });
            });

            document.querySelectorAll('.delete-btn').forEach(b => {
                b.addEventListener('click', function() {
                    if (confirm('Delete this alert?')) {
                        const id = this.dataset.id;
                        fetch(`/api/delete/${id}`, { method: 'DELETE' })
                            .then(res => res.json())
                            .then(data => {
                                if (data.status === 'ok') fetchAlerts();
                            });
                    }
                });
            });
        })
        .catch(error => {
            console.error('Fetch error:', error);
            document.getElementById('alertTableBody').innerHTML =
                `<tr><td colspan="6" class="text-center text-danger" style="font-size:0.9rem;">Error loading alerts.</td></tr>`;
        });
}

// ---------- ADD ALERT ----------
document.getElementById('addBtn').addEventListener('click', function() {
    const symbol = document.getElementById('symbolInput').value.trim().toUpperCase();
    const condition = document.getElementById('condSelect').value;
    const price = document.getElementById('priceInput').value.trim();

    if (!symbol || !price) {
        document.getElementById('addMessage').innerHTML = '<span class="text-danger">Fill all fields.</span>';
        return;
    }

    const payload = { symbol, condition, price: parseFloat(price) };

    fetch('/api/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'ok') {
            document.getElementById('addMessage').innerHTML = '<span class="text-success">✅ Added!</span>';
            document.getElementById('symbolInput').value = '';
            document.getElementById('priceInput').value = '';
            fetchAlerts();
        } else if (data.status === 'warning') {
            if (confirm(`⚠️ ${data.message}\n\nAdd anyway?`)) {
                payload.force = true;
                fetch('/api/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(res2 => res2.json())
                .then(data2 => {
                    if (data2.status === 'ok') {
                        document.getElementById('addMessage').innerHTML = '<span class="text-success">✅ Added anyway!</span>';
                        document.getElementById('symbolInput').value = '';
                        document.getElementById('priceInput').value = '';
                        fetchAlerts();
                    } else {
                        document.getElementById('addMessage').innerHTML = `<span class="text-danger">❌ ${data2.message}</span>`;
                    }
                });
            } else {
                document.getElementById('addMessage').innerHTML = '<span class="text-warning">⏸️ Cancelled.</span>';
            }
        } else {
            document.getElementById('addMessage').innerHTML = `<span class="text-danger">❌ ${data.message}</span>`;
        }
    })
    .catch(err => {
        document.getElementById('addMessage').innerHTML = `<span class="text-danger">❌ Server error</span>`;
    });
});

// ---------- EXPORT / IMPORT ----------
document.getElementById('exportBtn').addEventListener('click', function() {
    fetch('/api/export')
        .then(res => res.json())
        .then(data => {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `alerts_backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        })
        .catch(err => alert('Export failed.'));
});

document.getElementById('importBtn').addEventListener('click', function() {
    document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', function(event) {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if (!Array.isArray(data)) { alert('Invalid JSON format.'); return; }
            if (confirm(`Replace all alerts with ${data.length} from this file?`)) {
                fetch('/api/import', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                .then(res => res.json())
                .then(result => {
                    if (result.status === 'ok') {
                        document.getElementById('importStatus').innerHTML = `✅ ${result.count} imported!`;
                        fetchAlerts();
                    } else {
                        alert('Import failed: ' + result.message);
                    }
                });
            }
        } catch (err) { alert('Invalid JSON file.'); }
    };
    reader.readAsText(file);
    this.value = '';
});

// ---------- INIT ----------
fetchAlerts();
setInterval(fetchAlerts, 60000);
</script>
</body>
</html>
