<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a73e8">
    <title>📊 Alert Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ============ THEME VARIABLES ============ */
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --surface-2: #f1f3f4;
            --text: #202124;
            --text-muted: #5f6368;
            --border: #dadce0;
            --border-light: #e8eaed;
            --primary: #1a73e8;
            --primary-fill: #1a73e8;
            --primary-text: #ffffff;
            --success: #1e8e3e;
            --danger: #d93025;
            --warning: #b06000;
            --warning-bg: #feefc3;
            --shadow-1: 0 1px 2px rgba(60,64,67,0.1), 0 1px 3px 1px rgba(60,64,67,0.06);
            --shadow-2: 0 1px 3px rgba(60,64,67,0.15), 0 4px 8px 3px rgba(60,64,67,0.08);
            --input-bg: #ffffff;
            --header-bg: #f1f3f4;
            --row-hover: #f8f9fa;
        }

        body.dark {
            --bg: #000000;
            --surface: #121212;
            --surface-2: #1e1e1e;
            --text: #e8eaed;
            --text-muted: #b0b4b8;
            --border: #3c4043;
            --border-light: #2a2a2a;
            --primary: #8ab4f8;
            --primary-fill: #8ab4f8;
            --primary-text: #202124;
            --success: #81c995;
            --danger: #f28b82;
            --warning: #fdd663;
            --warning-bg: #3c2f00;
            --shadow-1: 0 1px 3px rgba(0,0,0,0.7), 0 1px 2px rgba(0,0,0,0.5);
            --shadow-2: 0 4px 8px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.5);
            --input-bg: #1e1e1e;
            --header-bg: #1e1e1e;
            --row-hover: #1a1a1a;
        }

        /* ============ GLOBAL RESET ============ */
        * { box-sizing: border-box; }
        
        html {
            background-color: var(--bg) !important;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background-color: var(--bg) !important;
            color: var(--text);
            margin: 0;
            padding: 12px;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.2s ease, color 0.2s ease;
        }
        
        .container { 
            max-width: 100%; 
            padding: 0; 
            background-color: transparent;
        }
        
        .card {
            border-radius: 16px;
            background: var(--surface);
            box-shadow: var(--shadow-1);
            margin-bottom: 12px;
            padding: 16px;
            border: none;
            color: var(--text);
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        .card h5 {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 12px;
            color: var(--text);
            letter-spacing: 0.1px;
        }

        .text-muted { color: var(--text-muted) !important; }

        /* ============ HEADER ============ */
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 4px;
        }
        .header-row h1 {
            font-size: 1.4rem;
            font-weight: 500;
            margin: 0;
            color: var(--text);
            letter-spacing: 0.15px;
        }
        .theme-toggle-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--surface-2);
            color: var(--text);
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            box-shadow: var(--shadow-1);
        }
        .theme-toggle-btn:hover { background: var(--border); }
        .theme-toggle-btn:active { transform: scale(0.92); }

        /* ============ INPUTS ============ */
        .form-label {
            font-size: 0.75rem;
            margin-bottom: 4px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.4px;
        }
        .form-control-sm, .form-select-sm {
            font-size: 0.9rem;
            padding: 0.5rem 0.75rem;
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .form-control-sm:focus, .form-select-sm:focus {
            background: var(--input-bg);
            color: var(--text);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
            outline: none;
        }
        .form-control-sm::placeholder { color: var(--text-muted); opacity: 0.7; }

        /* ============ BUTTONS ============ */
        #addBtn {
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 500;
            letter-spacing: 0.3px;
            background: var(--primary-fill);
            color: var(--primary-text);
            border: none;
            transition: box-shadow 0.2s, transform 0.1s, background 0.2s;
            box-shadow: var(--shadow-1);
        }
        #addBtn:hover { box-shadow: var(--shadow-2); filter: brightness(1.05); }
        #addBtn:active { transform: scale(0.97); }

        .btn-tool {
            font-size: 0.75rem;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .btn-tool:active { transform: scale(0.96); }
        .btn-outline-success {
            color: var(--success) !important;
            border-color: var(--border) !important;
            background: var(--surface) !important;
        }
        .btn-outline-success:hover {
            background: var(--surface-2) !important;
            border-color: var(--success) !important;
        }
        .btn-outline-primary {
            color: var(--primary) !important;
            border-color: var(--border) !important;
            background: var(--surface) !important;
        }
        .btn-outline-primary:hover {
            background: var(--surface-2) !important;
            border-color: var(--primary) !important;
        }
        .btn-outline-secondary {
            color: var(--text-muted) !important;
            border-color: var(--border) !important;
            background: var(--surface) !important;
        }
        .btn-outline-secondary:hover { background: var(--surface-2) !important; }
        #duplicateBtn.active {
            background: var(--primary-fill) !important;
            color: var(--primary-text) !important;
            border-color: var(--primary-fill) !important;
            box-shadow: var(--shadow-1);
        }

        /* ============ TABLE ============ */
        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 12px;
        }
        .table-scroll table {
            width: 100%;
            min-width: 850px;
            margin-bottom: 0;
            border-collapse: collapse;
            background: var(--surface);
        }
        .table-scroll thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .table-scroll thead th {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 8px;
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
            white-space: nowrap;
            user-select: none;
        }
        .table-scroll thead th.sortable { cursor: pointer; transition: background 0.15s; }
        .table-scroll thead th.sortable:hover { background: var(--surface-2); }
        .table-scroll thead th .sort-icon { margin-left: 4px; font-size: 0.6rem; opacity: 0.4; }
        .table-scroll thead th.active .sort-icon { opacity: 1; color: var(--primary); }
        .table-scroll thead th.active { color: var(--primary); }

        .table-scroll tbody td {
            padding: 10px 8px;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-light);
            font-size: 0.8rem;
            white-space: nowrap;
            color: var(--text);
            background: var(--surface);
        }
        .table-scroll tbody tr:hover td { background: var(--row-hover); }

        .col-actions { min-width: 120px; width: 1%; text-align: center; }

        .text-left { text-align: left; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }

        /* ============ STATUS BUTTON ============ */
        .status-btn {
            width: 26px; height: 26px;
            border-radius: 50%;
            border: 2px solid var(--border);
            padding: 0; cursor: pointer;
            font-size: 0.6rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--border);
            color: #fff;
            transition: 0.2s;
        }
        .status-btn.active { background: #28a745; border-color: #28a745; }
        .status-btn.triggered { background: #dc3545; border-color: #dc3545; cursor: not-allowed; opacity: 0.85; }
        .status-btn.inactive { background: #6c757d; border-color: #6c757d; }

        /* ============ COLORS ============ */
        .cmp-green, .gap-green, .pct-green { color: var(--success); font-weight: 600; }
        .cmp-red, .gap-red, .pct-red { color: var(--danger); font-weight: 600; }
        .cmp-neutral, .gap-neutral, .pct-neutral { color: var(--text-muted); }

        /* ============ ACTION BUTTONS ============ */
        .table .btn-sm {
            padding: 6px 10px;
            font-size: 0.75rem;
            border-radius: 10px;
            margin: 0 2px;
            border: 1px solid var(--border);
            background: var(--surface);
            transition: background 0.15s, transform 0.1s;
        }
        .table .btn-sm:hover { background: var(--surface-2); }
        .table .btn-sm:active { transform: scale(0.94); }
        .table .btn-outline-primary { color: var(--primary) !important; }
        .table .btn-outline-danger { color: var(--danger) !important; }
        .table .btn-outline-warning { color: var(--warning) !important; }

        /* ============ AUTOCOMPLETE ============ */
        .input-group { position: relative; }
        #symbolInput { position: relative; z-index: 1000; }
        .autocomplete-items {
            position: absolute;
            z-index: 999;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-top: none;
            max-height: 200px;
            overflow-y: auto;
            border-radius: 0 0 12px 12px;
            top: 100%; left: 0;
            box-shadow: var(--shadow-2);
        }
        .autocomplete-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-light);
            font-size: 0.85rem;
            color: var(--text);
            transition: background 0.1s;
        }
        .autocomplete-item:hover { background: var(--surface-2); }
        .autocomplete-item .symbol { font-weight: 500; margin-right: 8px; color: var(--primary); }
        .autocomplete-item .name { color: var(--text-muted); font-size: 0.75rem; }

        #searchBox { flex: 1; min-width: 180px; max-width: 320px; }
        #clearSearchBtn, #duplicateBtn { padding: 0.4rem 0.8rem; }

        /* ============ DATA TOOLS LAYOUT ============ */
        .data-tools {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .data-tools .tool-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
        }
        .data-tools .search-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 220px;
        }

        #importStatus {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--success);
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        /* ============ MODAL ============ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: var(--surface);
            color: var(--text);
            border-radius: 20px;
            padding: 22px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow-2);
            border: 1px solid var(--border);
            animation: modalIn 0.15s ease-out;
        }
        @keyframes modalIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-box h6 {
            font-size: 1.05rem;
            font-weight: 500;
            margin: 0 0 14px 0;
            color: var(--text);
            letter-spacing: 0.2px;
        }
        .modal-body-content {
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text);
        }
        .modal-body-content .label {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .modal-body-content .value {
            font-weight: 500;
        }
        .modal-warning {
            margin-top: 14px;
            padding: 10px 12px;
            background: var(--warning-bg);
            color: var(--warning);
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .modal-actions .btn {
            min-width: 80px;
            font-size: 0.85rem;
            padding: 0.45rem 1rem;
            border-radius: 20px;
            font-weight: 500;
        }
        #modalOkBtn {
            background: var(--primary-fill);
            color: var(--primary-text);
            border: none;
        }
        #modalOkBtn:hover { filter: brightness(1.05); }
        #modalEditBtn {
            background: var(--surface);
            color: var(--primary);
            border: 1px solid var(--border);
        }
        #modalEditBtn:hover { background: var(--surface-2); }
        #modalCancelBtn {
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        #modalCancelBtn:hover { background: var(--surface-2); }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 576px) {
            body { padding: 6px; }
            .card { padding: 12px; margin-bottom: 10px; border-radius: 14px; }
            .card h5 { font-size: 0.95rem; }
            .header-row h1 { font-size: 1.2rem; }
            .theme-toggle-btn { width: 40px; height: 40px; font-size: 1rem; }
            .table-scroll table { min-width: 800px; }
            .table-scroll thead th { font-size: 0.55rem; padding: 8px 5px; }
            .table-scroll tbody td { font-size: 0.72rem; padding: 8px 5px; }
            .table .btn-sm { padding: 5px 8px; font-size: 0.7rem; }
            .status-btn { width: 22px; height: 22px; font-size: 0.55rem; }
            .form-control-sm, .form-select-sm { font-size: 0.85rem; padding: 0.4rem 0.6rem; }
            #addBtn { font-size: 0.85rem; padding: 0.4rem 0.7rem; }
            .btn-tool { font-size: 0.65rem; padding: 0.3rem 0.6rem; }
            .autocomplete-item { padding: 8px 10px; font-size: 0.8rem; }
            .autocomplete-item .name { font-size: 0.7rem; }
            .col-actions { min-width: 110px; }
            #searchBox { min-width: 0; max-width: none; }
            .modal-box { padding: 18px; border-radius: 16px; }
            .modal-actions .btn { min-width: 70px; font-size: 0.8rem; }
        }

        body.dark .table-hover > tbody > tr:hover > * { background-color: var(--row-hover); }
        body.dark .badge { background: var(--surface-2); }
    </style>
</head>
<body>
<div class="container">

    <div class="header-row">
        <h1>📊 Alert Manager</h1>
        <button id="themeToggle" class="theme-toggle-btn" title="Toggle theme">🌙</button>
    </div>

    <!-- ADD NEW ALERT -->
    <div class="card">
        <h5>➕ Add New Alert</h5>
        <div class="row g-2 align-items-end">
            <div class="col-12 col-md-4">
                <label class="form-label">SYMBOL</label>
                <div class="input-group">
                    <input type="text" id="symbolInput" class="form-control form-control-sm" placeholder="Type symbol or name" autocomplete="off" style="z-index:1001;">
                    <div id="autocompleteList" class="autocomplete-items" style="display:none;"></div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label">CONDITION</label>
                <select id="condSelect" class="form-select form-select-sm">
                    <option value=">=" selected>&gt;=</option>
                    <option value="<=">&lt;=</option>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label">PRICE</label>
                <input type="number" id="priceInput" class="form-control form-control-sm" placeholder="e.g. 5000" step="0.01">
            </div>
            <div class="col-12 col-md-2">
                <button id="addBtn" class="btn w-100">Add</button>
            </div>
        </div>
        <div id="addMessage" class="mt-2 small" style="font-size:0.85rem;"></div>
    </div>

    <!-- DATA TOOLS -->
    <div class="card" style="padding: 12px 16px;">
        <div class="data-tools">
            <div class="tool-group">
                <span style="font-size:0.9rem; font-weight:500; color:var(--text-muted);">💾</span>
                <button id="exportBtn" class="btn btn-outline-success btn-tool">📥 Export</button>
                <button id="importBtn" class="btn btn-outline-primary btn-tool">📤 Import</button>
                <button id="duplicateBtn" class="btn btn-outline-primary btn-tool" title="Show only duplicate symbols">🔁 Duplicates</button>
            </div>
            <div class="search-group">
                <input type="text" id="searchBox" class="form-control form-control-sm" placeholder="🔍 Search symbol or company">
                <button id="clearSearchBtn" class="btn btn-outline-secondary btn-tool" title="Clear search">✕ Clear</button>
            </div>
            <input type="file" id="fileInput" accept=".json" style="display: none;">
            <span id="importStatus"></span>
        </div>
    </div>

    <!-- ALERTS TABLE -->
    <div class="card" style="padding: 12px 6px;">
        <h5 style="padding-left:10px;">📋 Your Alerts</h5>
        <div class="table-scroll">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th class="sortable text-left" data-sort="symbol">Symbol <span class="sort-icon">↕</span></th>
                        <th class="text-center">Cond</th>
                        <th class="sortable text-right" data-sort="trigger">Trigger <span class="sort-icon">↕</span></th>
                        <th class="sortable text-right" data-sort="cmp">CMP <span class="sort-icon">↕</span></th>
                        <th class="sortable text-right" data-sort="gap">% Gap <span class="sort-icon">↕</span></th>
                        <th class="sortable text-right" data-sort="mgap">MGAP <span class="sort-icon">↕</span></th>
                        <th class="sortable text-right" data-sort="pct_chg">% Chg <span class="sort-icon">↕</span></th>
                        <th class="sortable text-center" data-sort="status">Status <span class="sort-icon">↕</span></th>
                        <th class="sortable text-left" data-sort="added">Added <span class="sort-icon">↕</span></th>
                        <th class="text-center col-actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="alertTableBody">
                    <tr><td colspan="10" class="text-center text-muted" style="font-size:0.9rem;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ============ REACTIVATE MODAL ============ -->
<div id="reactivateModal" class="modal-overlay">
    <div class="modal-box">
        <h6>🔄 Reactivate Alert</h6>
        <div id="reactivateModalBody" class="modal-body-content"></div>
        <div class="modal-actions">
            <button id="modalOkBtn" class="btn">OK</button>
            <button id="modalEditBtn" class="btn">Edit</button>
            <button id="modalCancelBtn" class="btn">Cancel</button>
        </div>
    </div>
</div>

<script>
// ============ THEME TOGGLE ============
const themeToggle = document.getElementById('themeToggle');

function applyTheme(theme) {
    if (theme === 'dark') {
        document.body.classList.add('dark');
        themeToggle.textContent = '☀️';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000');
    } else {
        document.body.classList.remove('dark');
        themeToggle.textContent = '🌙';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a73e8');
    }
}

const savedTheme = localStorage.getItem('alertManagerTheme') || 'light';
applyTheme(savedTheme);

themeToggle.addEventListener('click', function() {
    const isDark = document.body.classList.contains('dark');
    const newTheme = isDark ? 'light' : 'dark';
    applyTheme(newTheme);
    localStorage.setItem('alertManagerTheme', newTheme);
});

// ---------- AUTOCOMPLETE ----------
const symbolInput = document.getElementById('symbolInput');
const autocompleteList = document.getElementById('autocompleteList');
const searchBox = document.getElementById('searchBox');
const clearSearchBtn = document.getElementById('clearSearchBtn');
const duplicateBtn = document.getElementById('duplicateBtn');

let showDuplicatesOnly = false;

symbolInput.addEventListener('input', function() {
    const query = this.value.trim();
    if (query.length < 1) { autocompleteList.style.display = 'none'; return; }
    fetch(`/api/search?q=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(data => {
            if (data.length === 0) { autocompleteList.style.display = 'none'; return; }
            let html = '';
            data.forEach(item => {
                html += `<div class="autocomplete-item" data-symbol="${item.symbol}">
                    <span class="symbol">${item.symbol}</span>
                    <span class="name">${item.name}</span>
                </div>`;
            });
            autocompleteList.innerHTML = html;
            autocompleteList.style.display = 'block';
            document.querySelectorAll('.autocomplete-item').forEach(el => {
                el.addEventListener('click', function() {
                    symbolInput.value = this.dataset.symbol;
                    autocompleteList.style.display = 'none';
                    symbolInput.blur();
                });
            });
        })
        .catch(() => { autocompleteList.style.display = 'none'; });
});
document.addEventListener('click', function(e) {
    if (e.target !== symbolInput) autocompleteList.style.display = 'none';
});

// ---------- SEARCH & DUPLICATE FILTER ----------
searchBox.addEventListener('input', filterTable);

clearSearchBtn.addEventListener('click', function() {
    searchBox.value = '';
    showDuplicatesOnly = false;
    duplicateBtn.classList.remove('active');
    filterTable();
});

duplicateBtn.addEventListener('click', function() {
    showDuplicatesOnly = !showDuplicatesOnly;
    if (showDuplicatesOnly) duplicateBtn.classList.add('active');
    else duplicateBtn.classList.remove('active');
    filterTable();
});

function getDuplicateSymbols() {
    const counts = {};
    alertsData.forEach(a => {
        const s = (a.symbol || '').toUpperCase();
        counts[s] = (counts[s] || 0) + 1;
    });
    const dupes = new Set();
    Object.keys(counts).forEach(s => { if (counts[s] > 1) dupes.add(s); });
    return dupes;
}

function filterTable() {
    const query = searchBox.value.trim().toUpperCase();
    const dupes = showDuplicatesOnly ? getDuplicateSymbols() : null;
    const rows = document.querySelectorAll('#alertTableBody tr');
    rows.forEach(row => {
        if (!row.dataset.symbol) return;
        const symbol = (row.dataset.symbol || '').toUpperCase();
        const company = (row.dataset.company || '').toUpperCase();
        const matchesSearch = !query || symbol.includes(query) || company.includes(query);
        const matchesDup = !dupes || dupes.has(symbol);
        row.style.display = (matchesSearch && matchesDup) ? '' : 'none';
    });
}

// ---------- SORTING ----------
let currentSort = { column: null, direction: 1 };
let alertsData = [];

function sortAlerts(data, column, direction) {
    const sorted = [...data];
    sorted.sort((a, b) => {
        let valA, valB;
        switch (column) {
            case 'symbol': valA = a.symbol || ''; valB = b.symbol || ''; return direction * valA.localeCompare(valB);
            case 'trigger': valA = parseFloat(a.trigger_price) || 0; valB = parseFloat(b.trigger_price) || 0; return direction * (valA - valB);
            case 'cmp': valA = parseFloat(a.cmp) || 0; valB = parseFloat(b.cmp) || 0; return direction * (valA - valB);
            case 'gap': { const gapA = calculateGap(a), gapB = calculateGap(b); return direction * (gapA - gapB); }
            case 'mgap': {
                const gapA = calculateGap(a), gapB = calculateGap(b);
                const absA = isFinite(gapA) ? Math.abs(gapA) : Infinity;
                const absB = isFinite(gapB) ? Math.abs(gapB) : Infinity;
                return direction * (absA - absB);
            }
            case 'pct_chg': valA = parseFloat(a.pct_chg) || 0; valB = parseFloat(b.pct_chg) || 0; return direction * (valA - valB);
            case 'status': {
                const getStatusVal = (item) => {
                    if (item.is_triggered === 1) return 2;
                    if (item.is_active === 1) return 0;
                    return 1;
                };
                return direction * (getStatusVal(a) - getStatusVal(b));
            }
            case 'added':
                valA = new Date(a.added_at).getTime() || 0;
                valB = new Date(b.added_at).getTime() || 0;
                return direction * (valA - valB);
            default: return 0;
        }
    });
    return sorted;
}

function calculateGap(item) {
    const cmp = parseFloat(item.cmp);
    const trigger = parseFloat(item.trigger_price);
    if (!cmp || !trigger) return Infinity;
    return ((trigger - cmp) / cmp) * 100;
}

function formatDate(dateStr) {
    if (!dateStr) return '-';
    try {
        const d = new Date(dateStr);
        d.setHours(d.getHours() + 5);
        d.setMinutes(d.getMinutes() + 30);
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        const hours = String(d.getHours()).padStart(2, '0');
        const minutes = String(d.getMinutes()).padStart(2, '0');
        return `${day}/${month}/${year} ${hours}:${minutes}`;
    } catch { return '-'; }
}

// ---------- RENDER ----------
function renderAlerts(data) {
    const tbody = document.getElementById('alertTableBody');
    if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" class="text-center text-muted" style="font-size:0.9rem;">No alerts set.</td></tr>`;
        return;
    }

    let html = '';
    data.forEach(a => {
        let cmpDisplay = '-';
        let cmpClass = 'cmp-neutral';
        if (a.cmp !== null && a.cmp !== undefined) {
            cmpDisplay = a.cmp;
            if (a.condition === '>=' && a.cmp >= a.trigger_price) cmpClass = 'cmp-green';
            else if (a.condition === '<=' && a.cmp <= a.trigger_price) cmpClass = 'cmp-green';
            else cmpClass = 'cmp-red';
        }

        let gapDisplay = '-';
        let gapClass = 'gap-neutral';
        const gap = calculateGap(a);
        if (isFinite(gap)) {
            gapDisplay = gap.toFixed(1) + '%';
            const conditionMet = (a.condition === '>=' && a.cmp >= a.trigger_price) ||
                                 (a.condition === '<=' && a.cmp <= a.trigger_price);
            if (a.is_triggered === 1) {
                gapClass = conditionMet ? 'gap-green' : 'gap-red';
                gapDisplay = '🔔 ' + gapDisplay;
            } else {
                if (conditionMet) {
                    gapClass = 'gap-green';
                    gapDisplay = '⏳ ' + gapDisplay;
                } else {
                    gapClass = 'gap-red';
                }
            }
        }

        let mgapDisplay = '-';
        if (isFinite(gap)) mgapDisplay = Math.abs(gap).toFixed(1) + '%';

        let pctChgDisplay = '-';
        let pctChgClass = 'pct-neutral';
        if (a.pct_chg !== null && a.pct_chg !== undefined && isFinite(a.pct_chg)) {
            pctChgDisplay = (a.pct_chg > 0 ? '+' : '') + a.pct_chg.toFixed(2) + '%';
            if (a.pct_chg > 0) pctChgClass = 'pct-green';
            else if (a.pct_chg < 0) pctChgClass = 'pct-red';
            else pctChgClass = 'pct-neutral';
        }

        let statusClass = 'inactive';
        let statusText = '⚪';
        let disabled = '';
        if (a.is_triggered === 1) {
            statusClass = 'triggered'; statusText = '🔴'; disabled = 'disabled';
        } else if (a.is_active === 1) {
            statusClass = 'active'; statusText = '🟢';
        } else {
            statusClass = 'inactive'; statusText = '⚪';
        }

        const dateDisplay = formatDate(a.added_at);
        const companyName = (a.company_name || '').replace(/"/g, '&quot;');

        html += `<tr data-symbol="${a.symbol}" data-company="${companyName}">
            <td class="text-left"><strong>${a.symbol}</strong></td>
            <td class="text-center">${a.condition}</td>
            <td class="text-right">${a.trigger_price}</td>
            <td class="text-right ${cmpClass}">${cmpDisplay}</td>
            <td class="text-right ${gapClass}">${gapDisplay}</td>
            <td class="text-right">${mgapDisplay}</td>
            <td class="text-right ${pctChgClass}">${pctChgDisplay}</td>
            <td class="text-center">
                <button class="status-btn ${statusClass}" data-id="${a.id}" data-active="${a.is_active}" data-triggered="${a.is_triggered}" ${disabled}>
                    ${statusText}
                </button>
            </td>
            <td class="text-left">${dateDisplay}</td>
            <td class="text-center" style="white-space:nowrap;">
                <button class="btn btn-sm btn-outline-primary edit-btn" data-id="${a.id}" data-symbol="${a.symbol}" data-price="${a.trigger_price}" data-condition="${a.condition}" title="Edit">✏️</button>
                ${a.is_triggered ? `<button class="btn btn-sm btn-outline-warning reactivate-btn" data-id="${a.id}" title="Reactivate">🔄</button>` : ''}
                <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${a.id}" title="Delete">🗑️</button>
            </td>
        </tr>`;
    });
    tbody.innerHTML = html;

    filterTable();

    // EDIT
    document.querySelectorAll('.edit-btn').forEach(b => {
        b.addEventListener('click', function() {
            const id = this.dataset.id;
            const symbol = this.dataset.symbol;
            const currentCondition = this.dataset.condition;
            const currentPrice = this.dataset.price;
            const input = prompt(`Edit condition & price (e.g., ">= 4000" or "<= 5000"):`, `${currentCondition} ${currentPrice}`);
            if (input) {
                const parts = input.trim().split(' ');
                if (parts.length === 2 && ['>=', '<='].includes(parts[0])) {
                    const newCond = parts[0];
                    const newPrice = parseFloat(parts[1]);
                    if (!isNaN(newPrice) && newPrice > 0) {
                        fetch(`/api/update/${id}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ condition: newCond, price: newPrice })
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data.status === 'ok') {
                                showMessage('success', `✅ ${symbol} ${newCond} ${newPrice} updated`);
                                fetchAlerts();
                            } else {
                                showMessage('danger', `❌ ${data.message}`);
                            }
                        });
                    } else {
                        showMessage('danger', '❌ Invalid price.');
                    }
                } else {
                    showMessage('danger', '❌ Invalid format. Use e.g. ">= 5000" or "<= 4000"');
                }
            }
        });
    });

    // REACTIVATE
    document.querySelectorAll('.reactivate-btn').forEach(b => {
        b.addEventListener('click', function() {
            const id = this.dataset.id;
            triggerReactivate(id);
        });
    });

    // TOGGLE
    document.querySelectorAll('.status-btn:not([disabled])').forEach(btn => {
        btn.addEventListener('click', function() {
            const id = this.dataset.id;
            fetch(`/api/toggle/${id}`, { method: 'POST' })
                .then(res => res.json())
                .then(data => { if (data.status === 'ok') fetchAlerts(); });
        });
    });

    // DELETE
    document.querySelectorAll('.delete-btn').forEach(b => {
        b.addEventListener('click', function() {
            if (confirm('Delete this alert?')) {
                const id = this.dataset.id;
                fetch(`/api/delete/${id}`, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(data => { if (data.status === 'ok') fetchAlerts(); });
            }
        });
    });
}

function showMessage(type, html) {
    const map = { success: 'var(--success)', danger: 'var(--danger)', warning: 'var(--warning)' };
    document.getElementById('addMessage').innerHTML =
        `<span style="color: ${map[type] || 'var(--text)'}; font-weight:500;">${html}</span>`;
}

// ---------- REACTIVATE FLOW ----------
function triggerReactivate(id) {
    fetch(`/api/reactivate/${id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dry_run: true })
    })
    .then(res => res.json())
    .then(preview => {
        if (preview.status !== 'ok') {
            showMessage('danger', `❌ ${preview.message || 'Preview failed'}`);
            return;
        }
        if (preview.would_trigger) {
            showReactivateModal(id, preview);
        } else {
            doReactivate(id);
        }
    })
    .catch(() => showMessage('danger', '❌ Preview error'));
}

function doReactivate(id) {
    fetch(`/api/reactivate/${id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dry_run: false })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'ok') {
            if (data.triggered) showMessage('success', '✅ Alert re-triggered immediately.');
            else showMessage('success', '✅ Alert reactivated.');
            fetchAlerts();
        } else {
            showMessage('danger', `❌ Reactivation failed: ${data.message}`);
        }
    });
}

// ---------- MODAL ----------
let pendingReactivateId = null;
let pendingPreview = null;

function showReactivateModal(id, preview) {
    pendingReactivateId = id;
    pendingPreview = preview;

    const body = document.getElementById('reactivateModalBody');
    body.innerHTML = `
        <div>
            <div><span class="label">Symbol:</span> <span class="value">${preview.symbol}</span></div>
            <div><span class="label">Condition:</span> <span class="value">${preview.condition} ${preview.trigger_price}</span></div>
            <div><span class="label">Current price:</span> <span class="value">${preview.current_price}</span></div>
        </div>
        <div class="modal-warning">⚠️ Condition is still met. Re-trigger this alert?</div>
    `;
    document.getElementById('reactivateModal').classList.add('show');
}

function hideReactivateModal() {
    document.getElementById('reactivateModal').classList.remove('show');
    pendingReactivateId = null;
    pendingPreview = null;
}

document.getElementById('modalOkBtn').addEventListener('click', function() {
    const id = pendingReactivateId;
    hideReactivateModal();
    if (id) doReactivate(id);
});

document.getElementById('modalCancelBtn').addEventListener('click', function() {
    hideReactivateModal();
    showMessage('warning', '⏸️ Alert kept deactivated.');
});

document.getElementById('modalEditBtn').addEventListener('click', function() {
    const id = pendingReactivateId;
    const preview = pendingPreview;
    hideReactivateModal();
    if (!id || !preview) return;

    const input = prompt(
        `Edit condition & price (e.g., ">= 4000" or "<= 5000"):`,
        `${preview.condition} ${preview.trigger_price}`
    );
    if (!input) return;

    const parts = input.trim().split(' ');
    if (parts.length === 2 && ['>=', '<='].includes(parts[0])) {
        const newCond = parts[0];
        const newPrice = parseFloat(parts[1]);
        if (!isNaN(newPrice) && newPrice > 0) {
            fetch(`/api/update/${id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ condition: newCond, price: newPrice })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'ok') {
                    showMessage('success', `✅ ${preview.symbol} ${newCond} ${newPrice} updated`);
                    // Re-run the reactivate flow with the new values
                    triggerReactivate(id);
                } else {
                    showMessage('danger', `❌ ${data.message}`);
                }
            });
        } else {
            showMessage('danger', '❌ Invalid price.');
        }
    } else {
        showMessage('danger', '❌ Invalid format. Use e.g. ">= 5000" or "<= 4000"');
    }
});

// Close modal if user clicks outside the box
document.getElementById('reactivateModal').addEventListener('click', function(e) {
    if (e.target.id === 'reactivateModal') hideReactivateModal();
});

// ---------- FETCH ----------
function fetchAlerts() {
    fetch('/api/alerts')
        .then(res => res.json())
        .then(data => {
            alertsData = data;
            if (currentSort.column) {
                const sorted = sortAlerts(alertsData, currentSort.column, currentSort.direction);
                renderAlerts(sorted);
            } else {
                renderAlerts(alertsData);
            }
        })
        .catch(error => {
            console.error('Fetch error:', error);
            document.getElementById('alertTableBody').innerHTML =
                `<tr><td colspan="10" class="text-center text-danger" style="font-size:0.9rem;">Error loading alerts.</td></tr>`;
        });
}

// ---------- SORT CLICK ----------
document.querySelectorAll('.sortable').forEach(header => {
    header.addEventListener('click', function() {
        const column = this.dataset.sort;
        if (currentSort.column === column) currentSort.direction *= -1;
        else { currentSort.column = column; currentSort.direction = 1; }
        document.querySelectorAll('.sortable').forEach(th => th.classList.remove('active'));
        this.classList.add('active');
        const sorted = sortAlerts(alertsData, currentSort.column, currentSort.direction);
        renderAlerts(sorted);
    });
});

// ---------- ADD ALERT ----------
document.getElementById('addBtn').addEventListener('click', function() {
    const symbol = document.getElementById('symbolInput').value.trim().toUpperCase();
    const condition = document.getElementById('condSelect').value;
    const price = document.getElementById('priceInput').value.trim();

    if (!symbol || !price) {
        showMessage('danger', 'Fill all fields.');
        return;
    }

    const payload = { symbol, condition, price: parseFloat(price) };

    fetch('/api/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => handleAddResponse(data, payload))
    .catch(() => showMessage('danger', '❌ Server error'));
});

function handleAddResponse(data, payload) {
    if (data.status === 'ok') {
        showMessage('success', `✅ ${data.symbol} ${data.condition} ${data.price} added`);
        document.getElementById('symbolInput').value = '';
        document.getElementById('priceInput').value = '';
        fetchAlerts();
    } else if (data.status === 'duplicate') {
        if (confirm(`⚠️ ${data.message}\n\nAdd anyway?`)) {
            payload.force_duplicate = true;
            fetch('/api/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(d => handleAddResponse(d, payload));
        } else {
            showMessage('warning', '⏸️ Add cancelled.');
        }
    } else if (data.status === 'warning') {
        if (confirm(`⚠️ ${data.message}\n\nAdd anyway?`)) {
            payload.force_trigger = true;
            fetch('/api/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(d => handleAddResponse(d, payload));
        } else {
            showMessage('warning', '⏸️ Add cancelled.');
        }
    } else {
        showMessage('danger', `❌ ${data.message}`);
    }
}

// ---------- EXPORT / IMPORT ----------
document.getElementById('exportBtn').addEventListener('click', function() {
    fetch('/api/export')
        .then(res => res.json())
        .then(data => {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `alerts_backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        })
        .catch(() => alert('Export failed.'));
});

document.getElementById('importBtn').addEventListener('click', function() {
    document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', function(event) {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if (!Array.isArray(data)) { alert('Invalid JSON format.'); return; }
            if (confirm(`Replace all alerts with ${data.length} from this file?`)) {
                fetch('/api/import', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                .then(res => res.json())
                .then(result => {
                    if (result.status === 'ok') {
                        document.getElementById('importStatus').textContent = `✅ ${result.count} imported`;
                        fetchAlerts();
                    } else {
                        alert('Import failed: ' + result.message);
                    }
                });
            }
        } catch (err) { alert('Invalid JSON file.'); }
    };
    reader.readAsText(file);
    this.value = '';
});

// ---------- INIT ----------
fetchAlerts();
setInterval(fetchAlerts, 60000);
</script>
</body>
