name: Deploy to Northflank

# Northflank's own CI does not fire on pushes to this repo (there are no repo
# webhooks and no auto-build), so every deploy used to mean tapping "Build" on
# the Commits page — awkward from a phone. This workflow does it for you:
# on every push to master it starts a Northflank build and then WAITS for it,
# so the result shows up right here in GitHub (green tick or red cross, with
# the reason) instead of on the Northflank dashboard.
#
# You can also run it by hand from the Actions tab — handy from the GitHub
# mobile app when you just want to redeploy.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northflank-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger Northflank build and wait for it
        env:
          # Accept the token under any of the likely names, so a small mismatch in
          # how the secret was named doesn't silently disable deploys. A secret is
          # strongly preferred over a variable (variables are not masked).
          NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN || secrets.NORTHFLANKTOKEN || secrets.NORTHFLANK_TOKEN || secrets.NF_TOKEN || secrets.NORTHFLANK_API_KEY || vars.NORTHFLANK_API_TOKEN }}
          # Override these with repository variables if the IDs ever change.
          NF_PROJECT: ${{ vars.NORTHFLANK_PROJECT || 'stock-alerts' }}
          NF_SERVICE: ${{ vars.NORTHFLANK_SERVICE || 'stock-alerts' }}
        run: |
          set -euo pipefail

          if [ -z "${NF_TOKEN}" ]; then
            echo "::warning::No Northflank API token found, so no build was triggered."
            echo "Looked for these names (secrets first):"
            echo "  secrets.NORTHFLANK_API_TOKEN   <- expected"
            echo "  secrets.NORTHFLANKTOKEN"
            echo "  secrets.NORTHFLANK_TOKEN"
            echo "  secrets.NF_TOKEN"
            echo "  secrets.NORTHFLANK_API_KEY"
            echo "  vars.NORTHFLANK_API_TOKEN"
            echo "Add it under Settings -> Secrets and variables -> Actions -> *Secrets*"
            echo "(not Variables), with the exact name NORTHFLANK_API_TOKEN."
            exit 0
          fi

          API="https://api.northflank.com/v1/projects/${NF_PROJECT}/services/${NF_SERVICE}"

          echo "Triggering build for ${NF_PROJECT}/${NF_SERVICE} (commit ${GITHUB_SHA:0:7})"

          # The free tier allows ONE active build per object, so a 409 just means
          # something else is building. Wait for it rather than failing.
          code=""
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/build.json -w '%{http_code}' \
              -X POST "${API}/build" \
              -H "Authorization: Bearer ${NF_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"sha\": \"${GITHUB_SHA}\"}") || code="000"
            echo "attempt ${attempt}: HTTP ${code}"
            [ "${code}" = "200" ] && break
            if [ "${code}" = "409" ]; then
              cat /tmp/build.json; echo
              echo "another build is active (free tier allows one at a time) — waiting 30s"
              sleep 30
              continue
            fi
            cat /tmp/build.json 2>/dev/null; echo
            echo "::error::Northflank rejected the build request (HTTP ${code})"
            exit 1
          done

          if [ "${code}" != "200" ]; then
            echo "::error::Build slot stayed busy for 6 minutes — check for a stuck build on the Builds page"
            exit 1
          fi
          cat /tmp/build.json; echo

          BUILD_ID=$(python3 -c "import json;print(json.load(open('/tmp/build.json'))['data']['id'])")
          echo "Build started: ${BUILD_ID}"
          {
            echo "### Northflank build \`${BUILD_ID}\`"
            echo ""
            echo "Commit \`${GITHUB_SHA:0:7}\` — [open build](https://app.northflank.com)"
          } >> "$GITHUB_STEP_SUMMARY"

          # Wait for it to conclude (builds take ~3-5 min).
          for i in $(seq 1 60); do
            sleep 15
            code=$(curl -sS -o /tmp/status.json -w '%{http_code}' \
              -H "Authorization: Bearer ${NF_TOKEN}" \
              "${API}/build/${BUILD_ID}")
            if [ "${code}" != "200" ]; then
              echo "status poll HTTP ${code} (attempt ${i})"
              continue
            fi
            concluded=$(python3 -c "import json;d=json.load(open('/tmp/status.json'))['data'];print(str(d.get('concluded',False)).lower())")
            status=$(python3 -c "import json;d=json.load(open('/tmp/status.json'))['data'];print(d.get('status','UNKNOWN'))")
            echo "attempt ${i}: status=${status} concluded=${concluded}"
            if [ "${concluded}" = "true" ]; then
              echo "### Result: ${status}" >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/status.json; echo
              case "${status}" in
                *SUCCESS*|*COMPLET*) echo "Build finished: ${status}"; exit 0 ;;
                *) echo "::error::Build concluded as ${status}"; exit 1 ;;
              esac
            fi
          done

          echo "::error::Timed out waiting for the build to conclude"
          exit 1
